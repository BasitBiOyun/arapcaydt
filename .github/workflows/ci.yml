name: Kontrol

# Every push to main (and every PR) runs the same checks a contributor runs locally.
# When they pass on main, the site is published to Vercel from here (the repo moved to another
# GitHub account and Vercel's own Git link could not follow it). Publishing needs three repo
# secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID; without them it is skipped.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: kontrol-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tip kontrolü
        run: npm run lint
      - name: Testler
        run: npm test
      - name: Derleme
        run: npm run build

  yayin:
    needs: kontrol
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Vercel anahtarları var mı
        id: anahtar
        run: echo "var=${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.anahtar.outputs.var == 'true'
        uses: actions/checkout@v4
      - if: steps.anahtar.outputs.var == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.anahtar.outputs.var == 'true'
        name: Vercel kimliklerini doğrula
        # Says in plain words which of the three secrets is wrong (no id or token is printed), and
        # hands the CLI the account the project really belongs to.
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          owner=$(api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.accountId // empty')
          if [ -n "$owner" ]; then
            # The CLI needs the project's own account id; a personal "Vercel ID" in its place fails to load the project.
            [ "$owner" = "$VERCEL_ORG_ID" ] || echo "::notice::VERCEL_ORG_ID projenin hesabıyla aynı değil; projenin hesabı kullanılıyor."
            echo "VERCEL_ORG_ID=$owner" >> "$GITHUB_ENV"
            exit 0
          fi
          user=$(api /v2/user | jq -r '.user.id // empty')
          [ -z "$user" ] && { echo "::error::VERCEL_TOKEN geçersiz ya da süresi dolmuş."; exit 1; }
          teams=$(api /v2/teams | jq -r '.teams[]?.id')
          if ! printf '%s\n' "$user" $teams | grep -qx "$VERCEL_ORG_ID"; then
            echo "::error::VERCEL_ORG_ID bu anahtarın eriştiği hesaplardan hiçbirine ait değil."
          fi
          for team in $teams; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$team")" = 200 ]; then
              [ "$team" = "$VERCEL_ORG_ID" ] || echo "::error::Proje başka bir ekipte: VERCEL_ORG_ID olarak projenin bulunduğu ekibin Team ID'si girilmeli."
              exit 1
            fi
          done
          echo "::error::VERCEL_PROJECT_ID bu anahtarla bulunamadı (proje kimliği yanlış ya da anahtar başka bir ekip için)."
          exit 1
      - if: steps.anahtar.outputs.var == 'true'
        name: Vercel ayarlarını al
        run: npx --yes vercel@60.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.anahtar.outputs.var == 'true'
        name: Derle
        run: npx --yes vercel@60.1.3 build --prod --token="$VERCEL_TOKEN"
      - if: steps.anahtar.outputs.var == 'true'
        name: Yayınla
        run: npx --yes vercel@60.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
